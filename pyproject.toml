[project]
name = "ytx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manoj Nawale", email = "nawalemanoj877@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.27.3",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
ytx = "ytx.cli:app"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
extend-exclude = [".claude"]
